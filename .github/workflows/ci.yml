name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-ledger:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.7'
      - name: Restore and verify frozen source bytes
        run: |
          python -m ledger restore
          python -m ledger hydrate
          python scripts/verify_contract.py
      - name: Exercise real filings, mutations, retries, and restarts
        run: python -m unittest discover -s tests -v
      - name: Run CLI and verify deterministic output
        run: |
          python -m ledger all
          python -m ledger diff
          python -m ledger evidence --period 2026-10-18 --field btc_held
          python -m ledger trace --period 2026-10-18 --ticker MSTR --action atm_sale --field amount_usd
          python -m ledger compare --period 2026-10-18 --against-period 2026-10-11 --field btc_held
          python -m ledger compare --period 2026-10-18 --accession 0001193125-26-424688 --against-period 2026-10-18 --field btc_held
          python scripts/verify_contract.py
          python -m compileall -q ledger scripts tests
